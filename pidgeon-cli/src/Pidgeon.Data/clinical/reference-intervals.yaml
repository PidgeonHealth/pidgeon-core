# Population-normal per-analyte reference intervals — the OBX-7 fact (Realism Program RI-1).
#
# ADVISORY; PENDING CLINICAL SIGN-OFF before any customer-facing use.
# Reviewer: sign-off-pending (flip to "Clinically reviewed and signed off by
# Connor YYYY-MM-DD" once reviewed, exactly as reference-ranges.yaml records).
# Date authored: 2026-07-10.
#
# This is the SINGLE, condition-independent, LOINC-keyed reference interval the lab
# valuation model reports in OBX-7 and judges the OBX-8 abnormal flag against. It is a
# DISTINCT artifact from reference-ranges.yaml (the SEM-F03 physiologically-impossible
# outer envelope, which the impossible-value check fires on and which must NOT be
# repurposed as a normal interval — Realism Program §2.1). Here:
#
#   low / high : the population-normal reference interval for a normal adult, the exact
#                pair OBX-7 reports (e.g. TSH 0.4-4.0 mIU/L). Authored from widely-
#                published adult reference-interval consensus, cited per row. NO CLSI.
#   unit       : the single canonical UCUM unit the interval is expressed in. Valuation
#                compares only when the reported unit matches (mismatched units skip),
#                mirroring reference-ranges.yaml and the semantic checks.
#   shape      : the analyte's intrinsic marginal shape for the condition-conditioned
#                sampler — "normal" (roughly symmetric) or "lognormal" (right-skewed).
#                Right-skewed analytes (glucose, enzymes, cardiac markers, BNP) are drawn
#                lognormal so the generated quantile ladder matches real skew (RI-6 / the
#                KS D<0.10 gate); symmetric analytes are drawn normal. This is the
#                analyte's shape; the condition-directed SHIFT and dispersion live in the
#                condition->analyte sampling data (comorbidity_matrix / relationships),
#                NOT here — the reference interval stays condition-independent (RI-1).
#   source     : the primary citation the interval was read from, specific enough for a
#                reviewer to locate the number. NO CLSI content.
#
# Coverage: the analytes the committed OBX goldens order plus the four B2 copula pairs.
# S0's interval-table slice widens this; a count guard (RI-8) makes widening safe.
#
# Licensing: docs/legal/standards-licensing.md (owned expression of public facts; adult
# reference-interval consensus cited per row; CLSI explicitly excluded; advisory; pending
# clinical sign-off).

source: "Adult population-normal reference intervals read-and-cited from published reference-interval consensus, per row (owned expression of public facts). NO CLSI. Advisory; PENDING CLINICAL SIGN-OFF (Connor)."
severity: advisory

intervals:
  - loinc: "3016-3"
    analyte: "Thyrotropin (TSH)"
    unit: "mIU/L"
    low: 0.4
    high: 4.0
    shape: lognormal
    source: "TSH adult reference interval 0.4-4.0 mIU/L, widely-published adult consensus. TSH is markedly right-skewed in the population; drawn lognormal."

  - loinc: "10839-9"
    analyte: "Troponin I.cardiac"
    unit: "ng/mL"
    low: 0.0
    high: 0.4
    shape: lognormal
    source: "Conventional cardiac troponin I adult reference: undetectable-to-0.04 ng/mL normal, ~0.4 ng/mL a commonly-cited decision threshold. Heavily right-skewed (near-zero in health, high in MI); drawn lognormal."

  - loinc: "2160-0"
    analyte: "Creatinine"
    unit: "mg/dL"
    low: 0.6
    high: 1.3
    shape: lognormal
    source: "Adult serum creatinine reference 0.6-1.3 mg/dL consensus. Right-skewed in the population (renal impairment lengthens the right tail); drawn lognormal."

  - loinc: "2345-7"
    analyte: "Glucose"
    unit: "mg/dL"
    low: 70.0
    high: 100.0
    shape: lognormal
    source: "Fasting plasma glucose adult reference 70-100 mg/dL (ADA normoglycemic band). Right-skewed (impaired glucose / diabetes lengthen the right tail); drawn lognormal."

  - loinc: "2823-3"
    analyte: "Potassium"
    unit: "mmol/L"
    low: 3.5
    high: 5.1
    shape: normal
    source: "Adult serum potassium reference 3.5-5.1 mmol/L consensus. Tightly regulated and roughly symmetric; drawn normal."

  - loinc: "30934-4"
    analyte: "B-type natriuretic peptide (BNP)"
    unit: "pg/mL"
    low: 0.0
    high: 100.0
    shape: lognormal
    source: "BNP adult reference: <100 pg/mL rules out heart failure in the acute setting (widely-published cutoff). Strongly right-skewed; drawn lognormal."

  - loinc: "4548-4"
    analyte: "Hemoglobin A1c"
    unit: "%"
    low: 4.0
    high: 5.7
    shape: lognormal
    source: "HbA1c adult reference 4.0-5.7% (ADA: <5.7 normal, 5.7-6.4 prediabetes, >=6.5 diabetes). Right-skewed (diabetic right tail); drawn lognormal."

  - loinc: "59408-5"
    analyte: "Oxygen saturation (SpO2)"
    unit: "%"
    low: 95.0
    high: 100.0
    shape: normal
    source: "Pulse-oximetry SpO2 adult normal 95-100%. Bounded near ceiling; drawn normal about the interval."

  - loinc: "6690-2"
    analyte: "Leukocytes (WBC count)"
    unit: "10*3/uL"
    low: 4.0
    high: 11.0
    shape: lognormal
    source: "Adult WBC reference 4-11 x10^3/uL consensus. Right-skewed (leukocytosis lengthens the right tail); drawn lognormal."

  - loinc: "3094-0"
    analyte: "Urea nitrogen (BUN)"
    unit: "mg/dL"
    low: 7.0
    high: 20.0
    shape: lognormal
    source: "Adult BUN reference 7-20 mg/dL consensus. Right-skewed (renal impairment); drawn lognormal. B2 copula pair member (BUN~creatinine)."

  - loinc: "1742-6"
    analyte: "Alanine aminotransferase (ALT)"
    unit: "U/L"
    low: 7.0
    high: 56.0
    shape: lognormal
    source: "Adult ALT reference 7-56 U/L consensus. Strongly right-skewed (hepatocellular injury); drawn lognormal. B2 copula pair member (ALT~AST)."

  - loinc: "1920-8"
    analyte: "Aspartate aminotransferase (AST)"
    unit: "U/L"
    low: 10.0
    high: 40.0
    shape: lognormal
    source: "Adult AST reference 10-40 U/L consensus. Strongly right-skewed (hepatocellular injury); drawn lognormal. B2 copula pair member (ALT~AST)."

  - loinc: "13457-7"
    analyte: "LDL cholesterol"
    unit: "mg/dL"
    low: 40.0
    high: 130.0
    shape: normal
    source: "Adult LDL-C reference: optimal <100, near-optimal 100-129 mg/dL (NCEP ATP III). Interval 40-130 mg/dL taken as the normal-to-near-optimal band; roughly symmetric over that band, drawn normal. B2 copula pair member (LDL~total cholesterol)."

  - loinc: "2093-3"
    analyte: "Cholesterol total"
    unit: "mg/dL"
    low: 100.0
    high: 200.0
    shape: normal
    source: "Adult total cholesterol reference: desirable <200 mg/dL (NCEP ATP III). Interval 100-200 mg/dL; roughly symmetric over the desirable band, drawn normal. B2 copula pair member (LDL~total cholesterol)."
